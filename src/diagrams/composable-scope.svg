<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 258" width="640" height="258">
  <!-- Where you call a composable decides whether its watchers ever stop. -->

  <text class="dg-eyebrow" x="0" y="14">CALLED IN setup()</text>
  <line class="dg-rule" x1="0" y1="26" x2="640" y2="26" />
  <text class="dg-text" x="0" y="52">watch() and computed() attach to the component's effect scope</text>
  <text class="dg-mono dg-muted" x="0" y="76">unmount → scope stops → watchers disposed</text>

  <g class="dg-stroke">
    <line x1="2" y1="104" x2="520" y2="104" />
    <line x1="2" y1="98" x2="2" y2="110" />
    <line x1="520" y1="98" x2="520" y2="110" />
  </g>
  <text class="dg-mono dg-muted" x="2" y="128">mount</text>
  <text class="dg-mono dg-muted" x="520" y="128" text-anchor="end">unmount</text>

  <text class="dg-eyebrow" x="0" y="178">CALLED IN A CLICK HANDLER, A ROUTE GUARD, A PINIA STORE</text>
  <line class="dg-rule" x1="0" y1="190" x2="640" y2="190" />
  <text class="dg-text" x="0" y="216">No active scope. The watcher outlives the component that made it.</text>

  <g class="dg-accent-stroke">
    <line x1="2" y1="246" x2="520" y2="246" />
    <line x1="2" y1="240" x2="2" y2="252" />
    <polyline points="513,241 520,246 513,251" />
  </g>
  <text class="dg-mono dg-accent" x="536" y="250">never ends</text>
</svg>
