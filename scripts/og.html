<!doctype html>
<!--
  Source for public/og.png (1200×630). Regenerate with `npm run og`.
  Kept as HTML so the social card stays in the same type system as the site.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2')
          format('woff2');
        font-weight: 400;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #fbfaf9;
        color: #1d1c1a;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 84px 88px;
      }
      .eyebrow {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 20px;
        letter-spacing: 0.14em;
        color: #6e6a63;
        text-transform: uppercase;
      }
      h1 {
        margin-top: 40px;
        font-size: 76px;
        line-height: 1.06;
        letter-spacing: -0.03em;
        font-weight: 600;
        max-width: 940px;
      }
      .foot {
        border-top: 1px solid #e8e5df;
        padding-top: 28px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 22px;
        color: #6e6a63;
      }
      .foot strong {
        color: #1d1c1a;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="eyebrow">Software engineer — Dhaka</div>
      <h1>I build web systems, and write down what they teach me.</h1>
    </div>
    <div class="foot">
      <strong>Emtiaz Zahid</strong>
      <span>emtiazzahid.github.io</span>
    </div>
  </body>
</html>
